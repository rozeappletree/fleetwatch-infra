node {
  name = "fleetwatch@localhost"
  cookie = "fleetwatch_secret"
  data_dir = "/opt/emqx/data"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
  enable_authn = false
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  enable_authn = false
}

dashboard {
  listeners {
    http {
      bind = "0.0.0.0:18083"
      max_connections = 512
    }
  }
  default_password = "public"
}

authorization {
  no_match = allow
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

log {
  console {
    level = warning
  }
}
