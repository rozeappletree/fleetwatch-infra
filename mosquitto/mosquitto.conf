# mosquitto/mosquitto.conf
# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto broker config for FleetTrack India.
#
# Plain TCP on 1883 for driver phones on the internal LAN / Docker network.
# For production: enable TLS listener on 8883 + password_file auth.
# ─────────────────────────────────────────────────────────────────────────────

# ── Listeners ────────────────────────────────────────────────────────────────
listener 1883
allow_anonymous true

# Optional: WebSocket listener (useful for browser MQTT clients / testing)
# listener 9001
# protocol websockets

# ── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ── Limits ───────────────────────────────────────────────────────────────────
max_queued_messages 1000
message_size_limit  65536    # 64KB max payload — truck events are ~200 bytes

# ── TODO (Production) ────────────────────────────────────────────────────────
